---
name: Build container images

permissions: {}

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - .github/workflows/build-container-images.yml
      - images/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/build-container-images.yml
      - images/**

concurrency:
  group: build-container-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs with the same matrix and steps (YAML anchors), so that only the
# non-PR job gets packages: write. Pushing still requires main in this repo.
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy: &strategy
      matrix:
        include:
          - image: kubectl
            version: v1.37.1  # renovate: datasource=github-releases depName=kubernetes/kubernetes
          - image: helm
            version: v4.3.1  # renovate: datasource=github-releases depName=helm/helm
          - image: clusterctl
            version: v1.14.4  # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
          - image: gardenctl
            version: v2.19.1  # renovate: datasource=github-releases depName=gardener/gardenctl-v2
          - image: kind
            version: v0.33.0  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
    steps: &steps
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.repository == 'YAKEcloud/yake-ansible' && github.ref == 'refs/heads/main'

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Containerfile
          push: ${{ github.repository == 'YAKEcloud/yake-ansible' && github.ref == 'refs/heads/main' }}
          sbom: true
          tags: ghcr.io/yakecloud/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            VERSION=${{ matrix.version }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy: *strategy
    steps: *steps
