---
name: Lint

"on":
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install linters and collections
        run: |
          pip install -r requirements-lint.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        if: ${{ !cancelled() }}
        run: yamllint .

      - name: flake8
        if: ${{ !cancelled() }}
        run: flake8 .

      - name: black
        if: ${{ !cancelled() }}
        run: black --check .

      - name: ansible-lint
        if: ${{ !cancelled() }}
        run: ansible-lint

      - name: hadolint
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(git ls-files | grep -E '(^|/)(Docker|Container)file$')
          hadolint "${files[@]}"

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(git ls-files | while read -r f; do
            if [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*(ba)?sh'; then echo "$f"; fi
          done)
          shellcheck --severity=warning "${files[@]}"
