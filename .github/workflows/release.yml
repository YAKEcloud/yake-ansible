---
name: Release

permissions: {}

"on":
  push:
    branches: [main]
    paths:
      - 'roles/gardener_operator/defaults/main.yml'
  workflow_dispatch:
    inputs:
      hotfix:
        description: 'Release a new -N revision of the current Gardener version'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release tag
        id: tag
        env:
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          version=$(sed -nE "s/^gardener_operator_version: '([^']+)'.*/\1/p" roles/gardener_operator/defaults/main.yml)
          [ -n "$version" ] || { echo "gardener_operator_version not found" >&2; exit 1; }
          last=$(git tag --list "v${version}-*" | sed -E 's/.*-//' | sort -n | tail -1)
          if [ -z "$last" ]; then
            revision=0
          elif [ "$HOTFIX" = "true" ]; then
            revision=$((last + 1))
          else
            echo "v${version}-${last} already exists, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "release=true"
            echo "name=v${version}-${revision}"
            echo "previous=$(git tag --list 'v*-*' --sort=-v:refname | head -1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
        run: |
          .github/scripts/build-release-notes.sh "$TAG" "$PREVIOUS" "$GITHUB_SHA" > notes.md
          [ "$(stat -c %s notes.md)" -le 120000 ] || truncate -s 120000 notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
