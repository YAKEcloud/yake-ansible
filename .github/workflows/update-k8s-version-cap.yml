---
name: Update Kubernetes version cap

permissions:
  contents: write

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update-cap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update cap from provider-openstack's supported versions
        id: update
        run: .github/scripts/update-k8s-version-cap.sh >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add renovate.json
          git commit -m "Update Kubernetes version cap to ${{ steps.update.outputs.allowed }}"
          git push
