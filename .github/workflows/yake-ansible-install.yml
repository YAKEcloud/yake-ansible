---
name: Yake-Ansible install

permissions:
  contents: read

# pull_request_target: the workflow file always comes from the base branch and
# has access to secrets. The PR head is only checked out in the job that is
# gated by an environment (manual approval for fork PRs, see below).
"on":
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/yake-ansible-install.yml'
      - 'group_vars/**'
      - 'roles/**'
      - 'site.yml'
      - 'cleanup.yml'
      - 'Giltfile.yaml'
      - 'requirements.txt'
      - 'requirements.yml'
  workflow_dispatch:

concurrency:
  group: "yake-ansible-install"
  cancel-in-progress: false

jobs:
  check-relevance:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # By SHA, as refs/pull/<n>/head can lag behind the pushed head.
      - name: Fetch PR head (script and checkout stay on the base branch)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "${HEAD_SHA}"

      - name: Check whether this PR touches anything CI-relevant
        id: check
        run: |
          .github/scripts/check-relevant-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            >> "$GITHUB_OUTPUT"

  yake-ansible-install:
    needs: [check-relevance]
    if: needs.check-relevance.outputs.relevant != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Fork PRs need approval by a required reviewer before this job gets the
    # secrets. Review the whole diff first and approve again after every push.
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ci-internal' || 'ci-external' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ssh git curl ca-certificates

      - name: Install requirements
        run: pip install -r requirements.txt && ansible-galaxy install -f -r requirements.yml

      - name: Write Ansible Vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault-pass.txt && chmod 600 .vault-pass.txt

      - name: Run ansible-playbook site.yml
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: ansible-playbook -i localhost, -c local site.yml -e "@group_vars/ci.yml" --vault-password-file .vault-pass.txt
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Wait for Garden readiness
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            ./.local/yake-kubectl \
              --kubeconfig /var/lib/yake/kubeconfig.garden \
              wait garden gardener \
              --for=condition=VirtualGardenAPIServerAvailable=True \
              --for=condition=RuntimeComponentsHealthy=True \
              --for=condition=VirtualComponentsHealthy=True \
              --for=condition=ObservabilityComponentsHealthy=True \
              --timeout=-1s

      - name: Dump Gardener status on failure
        if: failure()
        run: |
          echo "::group::Garden status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get garden -o wide || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get garden gardener -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}): {.message}{"\n"}{end}' || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden -n garden get pods || true
          echo "::endgroup::"
          echo "::group::Extension rollout status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get extensions.operator.gardener.cloud -o wide || true
          echo "::endgroup::"

      - name: Run cleanup
        if: always()
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ansible-playbook -i localhost, -c local cleanup.yml -e "@group_vars/ci.yml" --vault-password-file .vault-pass.txt
