---
name: Yake-Ansible install

permissions: {}

# Same-repo PRs (e.g. Renovate) and workflow_dispatch run the install test
# directly. Fork PRs never get secrets: a repo admin approves them by commenting
# "/ok-to-test" (or "/retest") on the PR. The issue_comment workflow always comes
# from the default branch. The head SHA is pinned when the comment is processed,
# later pushes are not tested. Optional: "/ok-to-test <sha>" aborts if the head
# differs from <sha>.
"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'group_vars/**'
      - 'roles/**'
      - 'site.yml'
      - 'cleanup.yml'
      - 'scripts/cleanup-openstack.py'
      - 'scripts/update-images.py'
      - 'Giltfile.yaml'
      - 'requirements.txt'
      - 'requirements.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  authorize:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/ok-to-test') ||
        startsWith(github.event.comment.body, '/retest')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run || steps.rel.outputs.run }}
      sha: ${{ steps.gate.outputs.sha }}
      # The managed seed is built unless the change is irrelevant for it (see check-relevant-changes.sh).
      seed: ${{ steps.rel.outputs.seed || 'true' }}
    steps:
      - name: Authorize ChatOps command
        id: gate
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            core.setOutput('run', 'false');
            const comment = context.payload.comment;
            const first = comment.body.split(/\r?\n/)[0].trim();
            const m = /^\/(?:ok-to-test|retest)(?:[ \t]+([0-9a-f]{7,40}))?$/i.exec(first);
            if (!m) return core.notice('Not a valid command.');
            const { owner, repo } = context.repo;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: comment.user.login,
            });
            if (perm.permission !== 'admin') {
              return core.notice(`${comment.user.login} is not a repo admin, ignoring.`);
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });
            if (pr.state !== 'open') return core.notice('PR is not open.');
            if (m[1] && !pr.head.sha.startsWith(m[1].toLowerCase())) {
              return core.setFailed(`Head is ${pr.head.sha}, not ${m[1]}. Review again.`);
            }
            core.setOutput('sha', pr.head.sha);
            core.setOutput('run', 'true');
            await core.summary.addRaw(`Testing PR head \`${pr.head.sha}\``).write();

      - name: Checkout repository
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to run
        id: rel
        if: github.event_name != 'issue_comment'
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "seed=true" >> "$GITHUB_OUTPUT"
          elif [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "::notice::Fork PR: no secrets. A repo admin must comment /ok-to-test to run the install test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            out=$(.github/scripts/check-relevant-changes.sh "${BASE_SHA}" "${HEAD_SHA}")
            echo "run=$(sed -n 's/^relevant=//p' <<< "${out}")" >> "$GITHUB_OUTPUT"
            echo "seed=$(sed -n 's/^seed=//p' <<< "${out}")" >> "$GITHUB_OUTPUT"
          fi

  # One install test at a time (shared OpenStack project). GitHub keeps at most
  # one pending run per concurrency group and cancels the others, so the queue
  # is built here: a run waits until all runs that started before it are done.
  queue:
    needs: [authorize]
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
    steps:
      - name: Wait for the runs that started earlier
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          started=$(gh api "${api}/runs/${RUN_ID}" --jq .run_started_at)
          while :; do
            runs=$(for s in in_progress queued pending; do
              gh api --paginate "${api}/workflows/yake-ansible-install.yml/runs?status=${s}&per_page=100" || exit 1
            done) &&
            ahead=$(jq -s "[.[].workflow_runs[] | select(.id != ${RUN_ID}
                and (.run_started_at < \"${started}\" or (.run_started_at == \"${started}\" and .id < ${RUN_ID})))] | length" <<< "${runs}") || ahead=""
            [ "${ahead}" = "0" ] && break
            echo "Waiting for ${ahead:-an unknown number of} earlier run(s)."
            sleep 60
          done

  yake-ansible-install:
    needs: [authorize, queue]
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-latest
    # At least the sum of the step timeouts below (30 setup, 40 images, 125 site.yml, 32 wait,
    # 5 dump, 47 cleanup = 279), so the cleanup always gets its full budget.
    timeout-minutes: 280
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      STATUS_SHA: ${{ needs.authorize.outputs.sha }}
    steps:
      # "Re-run failed jobs" does not run the queue job again. Stop if another install test is running.
      - name: Check that no other install test is running
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          for s in in_progress queued pending; do
            gh api --paginate "${api}/workflows/yake-ansible-install.yml/runs?status=${s}&per_page=100" --jq '.workflow_runs[].id'
          done | sort -u | { grep -vx "${RUN_ID}" || true; } | while read -r id; do
            gh api "${api}/runs/${id}/jobs" --jq '.jobs[] | select(.name == "yake-ansible-install" and .status == "in_progress") | "run '"${id}"'"'
          done > "${RUNNER_TEMP}/busy.txt"
          if [ -s "${RUNNER_TEMP}/busy.txt" ]; then
            echo "::error::Another install test is running ($(paste -sd, "${RUNNER_TEMP}/busy.txt")). Run this again later."
            exit 1
          fi
      - name: Report pending status
        if: github.event_name == 'issue_comment'
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.STATUS_SHA, state: 'pending',
              context: 'yake-ansible-install', description: 'Install test running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install requirements
        timeout-minutes: 15
        run: pip install -r requirements.txt && ansible-galaxy install -f -r requirements.yml

      - name: Write Ansible Vault password
        timeout-minutes: 1
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault-pass.txt && chmod 600 .vault-pass.txt

      # Uploads the CAPI image (and, with the seed, the Garden Linux image) if it is missing, which
      # keeps the test on the versions in ci.yml. The IDs of the images the updater selected go to
      # the cluster and the cloud profile: the machine-controller-manager cannot resolve image
      # names on clouds without the Nova image proxy.
      - name: Provide the images
        # An upload is rare (new version only). The updater waits up to 60 minutes per image, but
        # that is the worst case and would push the job to the 360 minute runner limit.
        timeout-minutes: 40
        env:
          SEED: ${{ needs.authorize.outputs.seed }}
        run: |
          ansible -i localhost, -c local localhost -m ansible.builtin.template \
            -a "src=${PWD}/roles/clusterapi_cluster/templates/clouds.yaml.j2 dest=${RUNNER_TEMP}/clouds.yaml mode=0600" \
            -e "@group_vars/ci.yml" --vault-password-file .vault-pass.txt > /dev/null
          export OS_CLIENT_CONFIG_FILE="${RUNNER_TEMP}/clouds.yaml" OS_CLOUD=openstack
          k8s=$(sed -n 's/^clusterapi_cluster_kubernetes_version: *//p' group_vars/ci.yml)
          ids="${RUNNER_TEMP}/image-ids"
          if [ "${SEED}" = "true" ]; then
            gl=$(sed -n 's/^ci_gardenlinux_version: *"\(.*\)"$/\1/p' group_vars/ci.yml)
            python3 scripts/update-images.py --ids-file "${ids}" --k8s-version "${k8s}" --gardenlinux-version "${gl}"
            gl_id=$(sed -n 's/^gardenlinux=//p' "${ids}")
            [ -n "${gl_id}" ] || { echo "::error::No Garden Linux image ID"; exit 1; }
            echo "GL_IMAGE_ID=${gl_id}" >> "$GITHUB_ENV"
          else
            python3 scripts/update-images.py --ids-file "${ids}" --k8s-version "${k8s}" --skip-gardenlinux
          fi
          capi_id=$(sed -n 's/^capi=//p' "${ids}")
          [ -n "${capi_id}" ] || { echo "::error::No CAPI image ID"; exit 1; }
          echo "CAPI_IMAGE_ID=${capi_id}" >> "$GITHUB_ENV"

      # Without the seed (irrelevant change) the cloud profile, seed and NTP/Kyverno are switched off.
      - name: Run ansible-playbook site.yml
        timeout-minutes: 125
        env:
          SEED: ${{ needs.authorize.outputs.seed }}
        run: |
          extra='{}'
          if [ "${SEED}" != "true" ]; then
            extra='{"gardener_operator_managed_seeds": [], "gardener_operator_cloudprofiles": [], "gardener_operator_ntp_servers": []}'
          fi
          for attempt in 1 2; do
            timeout --kill-after=1m 60m \
              ansible-playbook -i localhost, -c local site.yml -e "@group_vars/ci.yml" -e "${extra}" -e "clusterapi_cluster_openstack_image_id=${CAPI_IMAGE_ID}" -e "ci_gardenlinux_image_id=${GL_IMAGE_ID:-}" --vault-password-file .vault-pass.txt \
              && exit 0
            echo "::warning::site.yml attempt ${attempt} failed"
          done
          exit 1

      - name: Wait for Garden readiness
        timeout-minutes: 32
        run: |
          for attempt in 1 2 3; do
            timeout 10m ./.local/yake-kubectl \
              --kubeconfig /var/lib/yake/kubeconfig.garden \
              wait garden gardener \
              --for=condition=VirtualGardenAPIServerAvailable=True \
              --for=condition=RuntimeComponentsHealthy=True \
              --for=condition=VirtualComponentsHealthy=True \
              --for=condition=ObservabilityComponentsHealthy=True \
              --timeout=-1s \
              && exit 0
            echo "::warning::Garden not ready (attempt ${attempt})"
            sleep 30
          done
          exit 1

      - name: Dump Gardener status on failure
        if: failure()
        timeout-minutes: 5
        run: |
          echo "::group::Garden status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get garden -o wide || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get garden gardener -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}): {.message}{"\n"}{end}' || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden -n garden get pods || true
          echo "::endgroup::"
          echo "::group::Extension rollout status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get extensions.operator.gardener.cloud -o wide || true
          echo "::endgroup::"
          echo "::group::Managed seed status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/gardener-operator/kubeconfig.vgarden get managedseeds,seeds -A -o wide || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/gardener-operator/kubeconfig.vgarden -n garden get shoots -o jsonpath='{range .items[*]}{.metadata.name}: {.status.lastOperation.state} {.status.lastOperation.progress}% {.status.lastOperation.description}{"\n"}{range .status.lastErrors[*]}  error: {.description}{"\n"}{end}{end}' || true
          # Conditions that are not True explain why a seed or shoot is not ready
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/gardener-operator/kubeconfig.vgarden get seeds -o jsonpath='{range .items[*]}{.metadata.name}:{"\n"}{range .status.conditions[?(@.status!="True")]}  {.type}={.status} ({.reason}) {.message}{"\n"}{end}{end}' || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/gardener-operator/kubeconfig.vgarden -n garden get shoots -o jsonpath='{range .items[*]}{.metadata.name}:{"\n"}{range .status.conditions[?(@.status!="True")]}  {.type}={.status} ({.reason}) {.message}{"\n"}{end}{end}' || true
          echo "::endgroup::"
          # No pod logs: the logs of this public repository are public.
          echo "::group::Pods that are not ready (all namespaces)"
          # shellcheck disable=SC2016 # $p is a go-template variable
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get pods -A -o go-template='{{range .items}}{{$p := .}}{{if ne .status.phase "Succeeded"}}{{range .status.containerStatuses}}{{if not .ready}}{{$p.metadata.namespace}}/{{$p.metadata.name}} {{.name}} restarts={{.restartCount}}{{with .state.waiting}} waiting={{.reason}}{{end}}{{with .lastState.terminated}} last={{.reason}}/{{.exitCode}}{{end}}{{"\n"}}{{end}}{{end}}{{end}}{{end}}' || true
          echo "::endgroup::"
          echo "::group::Warning events (all namespaces)"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -n 40 || true
          echo "::endgroup::"

      - name: Run cleanup
        if: always()
        timeout-minutes: 47
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=1m 14m \
              ansible-playbook -i localhost, -c local cleanup.yml -e "@group_vars/ci.yml" --vault-password-file .vault-pass.txt \
              && exit 0
            echo "::warning::cleanup.yml attempt ${attempt} failed"
          done
          exit 1

      - name: Report final status
        if: always() && github.event_name == 'issue_comment'
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = { success: 'success', cancelled: 'error' }[process.env.JOB_STATUS] || 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.STATUS_SHA, state,
              context: 'yake-ansible-install', description: `Install test: ${state}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
