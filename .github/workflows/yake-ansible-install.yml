---
name: Yake-Ansible install

permissions: {}

# Same-repo PRs (e.g. Renovate) and workflow_dispatch run the install test
# directly. Fork PRs never get secrets: a repo admin approves them by commenting
# "/ok-to-test" (or "/retest") on the PR. The issue_comment workflow always comes
# from the default branch. The head SHA is pinned when the comment is processed,
# later pushes are not tested. Optional: "/ok-to-test <sha>" aborts if the head
# differs from <sha>.
"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'group_vars/**'
      - 'roles/**'
      - 'site.yml'
      - 'cleanup.yml'
      - 'Giltfile.yaml'
      - 'requirements.txt'
      - 'requirements.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  authorize:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/ok-to-test') ||
        startsWith(github.event.comment.body, '/retest')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run || steps.rel.outputs.run }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Authorize ChatOps command
        id: gate
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            core.setOutput('run', 'false');
            const comment = context.payload.comment;
            const first = comment.body.split(/\r?\n/)[0].trim();
            const m = /^\/(?:ok-to-test|retest)(?:[ \t]+([0-9a-f]{7,40}))?$/i.exec(first);
            if (!m) return core.notice('Not a valid command.');
            const { owner, repo } = context.repo;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: comment.user.login,
            });
            if (perm.permission !== 'admin') {
              return core.notice(`${comment.user.login} is not a repo admin, ignoring.`);
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });
            if (pr.state !== 'open') return core.notice('PR is not open.');
            if (m[1] && !pr.head.sha.startsWith(m[1].toLowerCase())) {
              return core.setFailed(`Head is ${pr.head.sha}, not ${m[1]}. Review again.`);
            }
            core.setOutput('sha', pr.head.sha);
            core.setOutput('run', 'true');
            await core.summary.addRaw(`Testing PR head \`${pr.head.sha}\``).write();

      - name: Checkout repository
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to run
        id: rel
        if: github.event_name != 'issue_comment'
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "::notice::Fork PR: no secrets. A repo admin must comment /ok-to-test to run the install test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            out=$(.github/scripts/check-relevant-changes.sh "${BASE_SHA}" "${HEAD_SHA}")
            echo "run=${out#relevant=}" >> "$GITHUB_OUTPUT"
          fi

  yake-ansible-install:
    needs: [authorize]
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-latest
    # At least the sum of the step timeouts below, so the cleanup always gets
    # its full budget before the job itself times out.
    timeout-minutes: 210
    permissions:
      contents: read
      statuses: write
    # One install test at a time (shared OpenStack project). GitHub keeps at
    # most one pending run per group: a newer run replaces a pending one, the
    # replaced run is cancelled and has to be triggered again if still needed.
    concurrency:
      group: "yake-ansible-install"
      cancel-in-progress: false
    env:
      STATUS_SHA: ${{ needs.authorize.outputs.sha }}
    steps:
      - name: Report pending status
        if: github.event_name == 'issue_comment'
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.STATUS_SHA, state: 'pending',
              context: 'yake-ansible-install', description: 'Install test running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install requirements
        timeout-minutes: 15
        run: pip install -r requirements.txt && ansible-galaxy install -f -r requirements.yml

      - name: Write Ansible Vault password
        timeout-minutes: 1
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault-pass.txt && chmod 600 .vault-pass.txt

      - name: Run ansible-playbook site.yml
        timeout-minutes: 92
        run: |
          for attempt in 1 2; do
            timeout --kill-after=1m 45m \
              ansible-playbook -i localhost, -c local site.yml -e "@group_vars/ci.yml" --vault-password-file .vault-pass.txt \
              && exit 0
            echo "::warning::site.yml attempt ${attempt} failed"
          done
          exit 1

      - name: Wait for Garden readiness
        timeout-minutes: 32
        run: |
          for attempt in 1 2 3; do
            timeout 10m ./.local/yake-kubectl \
              --kubeconfig /var/lib/yake/kubeconfig.garden \
              wait garden gardener \
              --for=condition=VirtualGardenAPIServerAvailable=True \
              --for=condition=RuntimeComponentsHealthy=True \
              --for=condition=VirtualComponentsHealthy=True \
              --for=condition=ObservabilityComponentsHealthy=True \
              --timeout=-1s \
              && exit 0
            echo "::warning::Garden not ready (attempt ${attempt})"
            sleep 30
          done
          exit 1

      - name: Dump Gardener status on failure
        if: failure()
        timeout-minutes: 5
        run: |
          echo "::group::Garden status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get garden -o wide || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get garden gardener -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}): {.message}{"\n"}{end}' || true
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden -n garden get pods || true
          echo "::endgroup::"
          echo "::group::Extension rollout status"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get extensions.operator.gardener.cloud -o wide || true
          echo "::endgroup::"
          # No pod logs: the logs of this public repository are public.
          echo "::group::Pods that are not ready (all namespaces)"
          # shellcheck disable=SC2016 # $p is a go-template variable
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get pods -A -o go-template='{{range .items}}{{$p := .}}{{if ne .status.phase "Succeeded"}}{{range .status.containerStatuses}}{{if not .ready}}{{$p.metadata.namespace}}/{{$p.metadata.name}} {{.name}} restarts={{.restartCount}}{{with .state.waiting}} waiting={{.reason}}{{end}}{{with .lastState.terminated}} last={{.reason}}/{{.exitCode}}{{end}}{{"\n"}}{{end}}{{end}}{{end}}{{end}}' || true
          echo "::endgroup::"
          echo "::group::Warning events (all namespaces)"
          ./.local/yake-kubectl --kubeconfig /var/lib/yake/kubeconfig.garden get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -n 40 || true
          echo "::endgroup::"

      - name: Run cleanup
        if: always()
        timeout-minutes: 47
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=1m 14m \
              ansible-playbook -i localhost, -c local cleanup.yml -e "@group_vars/ci.yml" --vault-password-file .vault-pass.txt \
              && exit 0
            echo "::warning::cleanup.yml attempt ${attempt} failed"
          done
          exit 1

      - name: Report final status
        if: always() && github.event_name == 'issue_comment'
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = { success: 'success', cancelled: 'error' }[process.env.JOB_STATUS] || 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.STATUS_SHA, state,
              context: 'yake-ansible-install', description: `Install test: ${state}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
