---
- name: Cleanup the deployment
  hosts: all

  vars_files:
    - roles/clusterapi_cluster/defaults/main.yml

  tasks:
    - name: Delete kind cluster
      ansible.builtin.command: "{{ playbook_dir }}/.local/yake-kind delete cluster --name clusterapi"
      register: kind_delete
      changed_when: kind_delete.rc == 0
      failed_when: false
      timeout: 300

    - name: Delete OpenStack resources built by this run
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/cleanup-openstack.py"
          - "--cluster-name"
          - "{{ clusterapi_cluster_name | d('garden') }}"
          - "--garden-url"
          - "{{ gardener_operator_garden_url }}"
          - "--seed-names"
          - "{{ gardener_operator_managed_seeds | d([]) | map(attribute='name') | join(',') }}"
          - "--seeds-project"
          - "{{ (gardener_operator_managed_seeds_project | d({})).name | d('seeds') }}"
      environment:
        OS_CLIENT_CONFIG_FILE: "{{ cleanup_clouds_file }}"
        OS_CLOUD: "{{ cleanup_openstack_cloud }}"
      changed_when: true

    # Off by default (CI never sets this); pass -e cleanup_full_local_reset=true
    # for a manual test run when you want a clean slate afterwards.
    - name: Full local reset
      when: cleanup_full_local_reset | d(false) | bool
      block:
        - name: Remove yake-ansible's own docker containers
          ansible.builtin.command: "docker rm -f {{ item }}"
          loop: [kind, helm, kubectl, clusterctl]
          failed_when: false
          changed_when: true

        - name: Find all local image IDs for yake-ansible's own images
          ansible.builtin.command: "docker images -q {{ item }}"
          register: cleanup_image_ids
          changed_when: false
          loop:
            - ghcr.io/yakecloud/kind
            - kindest/node
            - ghcr.io/yakecloud/helm
            - ghcr.io/yakecloud/kubectl
            - ghcr.io/yakecloud/clusterctl

        - name: Remove yake-ansible's own docker images
          ansible.builtin.command: "docker rmi -f {{ item }}"
          loop: "{{ cleanup_image_ids.results | map(attribute='stdout_lines') | sum(start=[]) | unique }}"
          failed_when: false
          changed_when: true

        - name: Remove local yake state directory
          ansible.builtin.file:
            path: /var/lib/yake/
            state: absent
          become: true
