[project]
site_name = "YAKE.ansible"
site_description = "Gardener-based Kubernetes platform on OpenStack"
site_url = "https://yake.cloud/"
repo_url = "https://github.com/YAKEcloud/yake-ansible"
repo_name = "YAKEcloud/yake-ansible"
edit_uri = "edit/main/docs/pages/"
docs_dir = "pages"
extra_css = ["assets/extra.css"]
extra_javascript = ["assets/a11y.js"]
copyright = """
Copyright &copy; 2026 23 Technologies GmbH &middot;
<a href="/legals/">Legals</a> &middot;
<a href="/privacy-policy/">Privacy policy</a>
"""

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "requirements.md",
    { "Installation" = "getting-started.md" },
    { "First shoot cluster" = "first-shoot.md" },
  ] },
  { "Concepts" = [
    "overview.md",
    "architecture.md",
    "networking.md",
    "glossary.md",
  ] },
  { "Operate" = [
    "configuration.md",
    "operations.md",
    "security.md",
    "releases.md",
    "scripts.md",
  ] },
]

[project.theme]
variant = "modern"
font = false
logo = "assets/logo.svg"
favicon = "assets/favicon.ico"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"

[project.plugins.minify]
minify_html = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
