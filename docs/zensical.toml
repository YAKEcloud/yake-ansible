[project]
site_name = "YAKE.ansible"
site_description = "Gardener-based Kubernetes platform on OpenStack"
site_url = "https://yake.cloud/"
repo_url = "https://github.com/YAKEcloud/yake-ansible"
repo_name = "YAKEcloud/yake-ansible"
edit_uri = "edit/main/docs/pages/"
docs_dir = "pages"
extra_css = ["assets/extra.css"]
copyright = """
Copyright &copy; 2026 23 Technologies GmbH &middot;
<a href="/legals/">Legals</a> &middot;
<a href="/privacy-policy/">Privacy policy</a>
"""

nav = [
  { "Home" = "index.md" },
  { "Docs" = [
    "getting-started.md",
    "architecture.md",
    "networking.md",
    "configuration.md",
    "operations.md",
  ] },
]

[project.theme]
variant = "modern"
font = false
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/favicon.ico"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
