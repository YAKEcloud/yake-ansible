---
- name: Copy clouds.yaml file
  ansible.builtin.template:
    src: clouds.yaml.j2
    dest: "/var/lib/yake/clouds.{{ clusterapi_cluster_name }}.yaml"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0600"
  no_log: true

- name: Slurp clouds.yaml file
  ansible.builtin.slurp:
    src: "/var/lib/yake/clouds.{{ clusterapi_cluster_name }}.yaml"
  register: result_clouds_yaml  # noqa: var-naming[no-role-prefix]
  no_log: true

- name: Set _clusterapi_cluster_cloud_yaml_b64 fact
  ansible.builtin.set_fact:
    _clusterapi_cluster_cloud_yaml_b64: "{{ result_clouds_yaml.content }}"
  no_log: true

- name: Copy secret template file
  ansible.builtin.template:
    src: cloud-secret.yaml.j2
    dest: /var/lib/yake/cloud-secret.yaml
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0600"
  no_log: true

- name: Get image info
  openstack.cloud.image_info:
    cloud: "{{ clusterapi_cluster_openstack_cloud }}"
    image: "{{ clusterapi_cluster_openstack_image_id }}"
  register: _clusterapi_cluster_image_info  # noqa: var-naming[no-role-prefix]

- name: Fail if image not found
  ansible.builtin.fail:
    msg: "Image ID '{{ clusterapi_cluster_openstack_image_id }}' was not found in OpenStack."
  when: _clusterapi_cluster_image_info.images | length == 0

- name: Fail if image name does not match expected name
  ansible.builtin.fail:
    msg: >-
      Image ID '{{ clusterapi_cluster_openstack_image_id }}' points to '{{ _clusterapi_cluster_image_info.images[0].name }}'
      but '{{ clusterapi_cluster_openstack_image_name }}' was expected.
      Please verify you are using the correct image ID.
  when:
    - clusterapi_cluster_openstack_image_name | d('') | length > 0
    - _clusterapi_cluster_image_info.images[0].name != clusterapi_cluster_openstack_image_name

- name: Get external network ID
  openstack.cloud.networks_info:
    cloud: "{{ clusterapi_cluster_openstack_cloud }}"
    name: "{{ clusterapi_cluster_openstack_external_network }}"
  register: result_external_network  # noqa: var-naming[no-role-prefix]

- name: Set _clusterapi_cluster_openstack_external_network fact
  ansible.builtin.set_fact:
    _clusterapi_cluster_openstack_external_network: "{{ result_external_network.networks | first | d({}) }}"

- name: Set _clusterapi_cluster_openstack_external_network_id fact
  ansible.builtin.set_fact:
    _clusterapi_cluster_openstack_external_network_id: "{{ _clusterapi_cluster_openstack_external_network.id | d('') }}"

- name: Create control plane server group
  openstack.cloud.server_group:
    cloud: "{{ clusterapi_cluster_openstack_cloud }}"
    state: present
    name: "{{ clusterapi_cluster_name }}-control-plane"
    policy: "{{ clusterapi_cluster_control_plane_server_group_policy }}"
  register: result_control_plane_server_group  # noqa: var-naming[no-role-prefix]
  when: clusterapi_cluster_control_plane_server_group_enabled | bool

- name: Set _clusterapi_cluster_control_plane_server_group_id fact
  ansible.builtin.set_fact:
    _clusterapi_cluster_control_plane_server_group_id: "{{ result_control_plane_server_group.server_group.id }}"
  when: clusterapi_cluster_control_plane_server_group_enabled | bool

- name: Create worker server group
  openstack.cloud.server_group:
    cloud: "{{ clusterapi_cluster_openstack_cloud }}"
    state: present
    name: "{{ clusterapi_cluster_name }}-worker"
    policy: "{{ clusterapi_cluster_worker_server_group_policy }}"
  register: result_worker_server_group  # noqa: var-naming[no-role-prefix]
  when: clusterapi_cluster_worker_server_group_enabled | bool

- name: Set _clusterapi_cluster_worker_server_group_id fact
  ansible.builtin.set_fact:
    _clusterapi_cluster_worker_server_group_id: "{{ result_worker_server_group.server_group.id }}"
  when: clusterapi_cluster_worker_server_group_enabled | bool

- name: Combine clusterapi_cluster_defaults and clusterapi_cluster_extra
  ansible.builtin.set_fact:
    _clusterapi_cluster: "{{ clusterapi_cluster_extra }}"  # noqa: var-naming[no-role-prefix]

- name: Copy cluster template file
  ansible.builtin.template:
    src: cluster-template.yaml.j2
    dest: /var/lib/yake/cluster-template.yaml
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"

- name: Create ssh keypair
  openstack.cloud.keypair:
    cloud: "{{ clusterapi_cluster_openstack_cloud }}"
    state: present
    name: "{{ clusterapi_cluster_openstack_ssh_key_name }}"
  register: result_keypair  # noqa: var-naming[no-role-prefix]

- name: Write private ssh key
  ansible.builtin.copy:
    content: "{{ result_keypair.keypair.private_key }}"
    dest: "/var/lib/yake/id_rsa.{{ clusterapi_cluster_name }}"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0600"
  when: result_keypair.changed  # noqa no-handler
  no_log: true

- name: Write public ssh key
  ansible.builtin.copy:
    content: "{{ result_keypair.keypair.public_key }}"
    dest: "/var/lib/yake/id_rsa.{{ clusterapi_cluster_name }}.pub"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"
  when: result_keypair.changed  # noqa no-handler

- name: Copy cluster configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/var/lib/yake/config.{{ clusterapi_cluster_name }}.yaml"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"

- name: Generate manifest to create Kubernetes cluster
  become: "{{ clusterapi_cluster_become }}"
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/.local/yake-clusterctl"
      - --config
      - "/var/lib/yake/config.{{ clusterapi_cluster_name }}.yaml"
      - generate
      - cluster
      - --from
      - /var/lib/yake/cluster-template.yaml
      - "{{ clusterapi_cluster_name }}"
  environment:
    KUBECONFIG: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_management_cluster_name }}"
  register: result_cluster_manifest  # noqa: var-naming[no-role-prefix]
  changed_when: false

- name: Write cluster manifest
  ansible.builtin.copy:
    content: "{{ result_cluster_manifest.stdout }}"
    dest: "/var/lib/yake/cluster.{{ clusterapi_cluster_name }}.yaml"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"

- name: Create cloud secret
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_management_cluster_name }}"
    state: present
    wait: true
    src: /var/lib/yake/cloud-secret.yaml

- name: Create Kubernetes cluster
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_management_cluster_name }}"
    state: present
    wait: true
    src: "/var/lib/yake/cluster.{{ clusterapi_cluster_name }}.yaml"

- name: Determine currently desired OpenStackMachineTemplate names
  ansible.builtin.set_fact:
    _clusterapi_cluster_current_machine_template_names: >-
      {{
        result_cluster_manifest.stdout | from_yaml_all | list
        | select('defined')
        | selectattr('kind', 'defined')
        | selectattr('kind', 'equalto', 'OpenStackMachineTemplate')
        | map(attribute='metadata.name')
        | list
      }}
  when: clusterapi_cluster_stale_machine_template_cleanup_enabled | bool

- name: List existing OpenStackMachineTemplates
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_management_cluster_name }}"
    api_version: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackMachineTemplate
    namespace: default
  register: result_existing_machine_templates  # noqa: var-naming[no-role-prefix]
  when: clusterapi_cluster_stale_machine_template_cleanup_enabled | bool

- name: Delete stale OpenStackMachineTemplates no longer referenced
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_management_cluster_name }}"
    state: absent
    api_version: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackMachineTemplate
    namespace: default
    name: "{{ item }}"
  loop: >-
    {{
      result_existing_machine_templates.resources
      | map(attribute='metadata.name')
      | select('match', '^' ~ (clusterapi_cluster_name | regex_escape) ~ '-')
      | reject('in', _clusterapi_cluster_current_machine_template_names)
      | list
    }}
  when: clusterapi_cluster_stale_machine_template_cleanup_enabled | bool

- name: Get kubeconfig
  ansible.builtin.command: "{{ playbook_dir }}/.local/yake-clusterctl get kubeconfig {{ clusterapi_cluster_name }}"
  register: result_kubeconfig  # noqa: var-naming[no-role-prefix]
  changed_when: false
  until: result_kubeconfig.rc == 0
  environment:
    KUBECONFIG: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_management_cluster_name }}"
  retries: 30
  delay: 10

- name: Write kubeconfig
  ansible.builtin.copy:
    content: "{{ result_kubeconfig.stdout }}"
    dest: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0600"
  no_log: true

- name: Wait for Kubernetes API
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    kind: Node
  register: result_k8s_nodes  # noqa: var-naming[no-role-prefix]
  until: result_k8s_nodes.resources is defined
  retries: 60
  delay: 10

- name: Include network tasks
  ansible.builtin.include_tasks: "network-{{ clusterapi_cluster_network }}.yml"

- name: Copy cloud.conf file
  ansible.builtin.template:
    src: cloud.conf.j2
    dest: "/var/lib/yake/cloud.{{ clusterapi_cluster_name }}.conf"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0600"
  no_log: true

- name: Slurp cloud.conf file
  ansible.builtin.slurp:
    src: "/var/lib/yake/cloud.{{ clusterapi_cluster_name }}.conf"
  register: register_cloud_conf  # noqa: var-naming[no-role-prefix]
  no_log: true

- name: Create cloud-config secret
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    state: present
    wait: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloud-config
        namespace: kube-system
      type: Opaque
      stringData: >-
        {{ {'cloud.conf': register_cloud_conf.content | b64decode} |
           combine({'cacert.pem': clusterapi_cluster_openstack_cacert}
                   if clusterapi_cluster_openstack_cacert | d('') | length > 0
                   else {}) }}
  no_log: true

- name: Copy CCM manifests
  ansible.builtin.copy:
    src: "cloud-controller-manager/{{ item }}"
    dest: "/var/lib/yake/{{ item }}"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"
  loop:
    - cloud-controller-manager-role-bindings.yaml
    - cloud-controller-manager-roles.yaml

# Manifests that need changes are patched in memory and written as a whole, so
# the task stays idempotent and the final manifest is available on the host.
- name: Write CCM DaemonSet manifest
  ansible.builtin.copy:
    content: "{{ (ccm_other + (ccm_daemonsets | map('combine', ccm_patch, recursive=True) | list)) | map('to_nice_yaml', indent=2, sort_keys=False) | join('---\n') }}"
    dest: /var/lib/yake/openstack-cloud-controller-manager-ds.yaml
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"
  vars:
    ccm: "{{ lookup('ansible.builtin.file', 'cloud-controller-manager/openstack-cloud-controller-manager-ds.yaml') | from_yaml_all | select | list }}"
    ccm_other: "{{ ccm | rejectattr('kind', 'equalto', 'DaemonSet') | list }}"
    ccm_daemonsets: "{{ ccm | selectattr('kind', 'equalto', 'DaemonSet') | list }}"
    ccm_patch:
      spec:
        template:
          spec:
            hostAliases: "{{ clusterapi_cluster_host_aliases }}"

- name: Apply CCM manifests
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    state: present
    src: "/var/lib/yake/{{ item }}"
  loop:
    - cloud-controller-manager-role-bindings.yaml
    - cloud-controller-manager-roles.yaml
    - openstack-cloud-controller-manager-ds.yaml

- name: Wait for coredns
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    kind: Deployment
    name: coredns
    namespace: kube-system
    wait: true
    wait_timeout: 300

- name: Deploy metrics-server
  kubernetes.core.helm:
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    release_name: metrics-server
    chart_ref: metrics-server
    chart_repo_url: https://kubernetes-sigs.github.io/metrics-server/
    chart_version: "{{ clusterapi_cluster_metrics_server_version }}"
    release_namespace: kube-system
    create_namespace: true
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    wait: true
    values: "{{ clusterapi_cluster_metrics_server_helm_values }}"
  environment: "{{ clusterapi_cluster_proxy_env }}"

- name: Copy CSI manifests
  ansible.builtin.copy:
    src: "cinder-csi/{{ item }}"
    dest: "/var/lib/yake/{{ item }}"
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"
  loop:
    - cinder-csi-controllerplugin-rbac.yaml
    - cinder-csi-nodeplugin-rbac.yaml
    - csi-cinder-driver.yaml

- name: Write CSI controller plugin manifest
  ansible.builtin.copy:
    content: "{{ csi_controller | combine(csi_controller_patch, recursive=True) | to_nice_yaml(indent=2, sort_keys=False) }}"
    dest: /var/lib/yake/cinder-csi-controllerplugin.yaml
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"
  vars:
    csi_controller: "{{ lookup('ansible.builtin.file', 'cinder-csi/cinder-csi-controllerplugin.yaml') | from_yaml }}"
    csi_disabled_containers: "{{ [] if clusterapi_cluster_csi_snapshotter_enabled | bool else ['csi-snapshotter'] }}"
    csi_containers: "{{ csi_controller.spec.template.spec.containers | rejectattr('name', 'in', csi_disabled_containers) | list }}"
    csi_controller_patch:
      spec:
        replicas: 2
        template:
          spec:
            containers: "{{ csi_containers }}"
            hostAliases: "{{ clusterapi_cluster_host_aliases }}"

- name: Write CSI node plugin manifest
  ansible.builtin.copy:
    content: "{{ csi_node | combine(csi_node_patch, recursive=True) | to_nice_yaml(indent=2, sort_keys=False) }}"
    dest: /var/lib/yake/cinder-csi-nodeplugin.yaml
    owner: "{{ clusterapi_cluster_uid }}"
    group: "{{ clusterapi_cluster_gid }}"
    mode: "0644"
  vars:
    csi_node: "{{ lookup('ansible.builtin.file', 'cinder-csi/cinder-csi-nodeplugin.yaml') | from_yaml }}"
    csi_node_patch:
      spec:
        template:
          spec:
            hostAliases: "{{ clusterapi_cluster_host_aliases }}"

- name: Apply CSI manifests
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    state: present
    src: "/var/lib/yake/{{ item }}"
  loop:
    - cinder-csi-controllerplugin-rbac.yaml
    - cinder-csi-controllerplugin.yaml
    - cinder-csi-nodeplugin-rbac.yaml
    - cinder-csi-nodeplugin.yaml
    - csi-cinder-driver.yaml

- name: Wait for CSI node plugin
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_cluster_name }}"
    kind: DaemonSet
    name: csi-cinder-nodeplugin
    namespace: kube-system
    wait: true
    wait_timeout: 300
