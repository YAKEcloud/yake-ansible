---
- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ clusterapi_install_uid }}"
    group: "{{ clusterapi_install_gid }}"
    mode: "0755"
    state: directory
  loop:
    - /var/lib/yake
    - "{{ playbook_dir }}/.local"

- name: Copy manifest to install ORC
  ansible.builtin.copy:
    src: orc.yaml
    dest: /var/lib/yake/install-orc.yaml
    owner: "{{ clusterapi_install_uid }}"
    group: "{{ clusterapi_install_gid }}"
    mode: "0644"

- name: Check for existing Cluster API installation
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    kind: CustomResourceDefinition
    name: providers.clusterctl.cluster.x-k8s.io
  register: clusterapi_install_crd

- name: Initialize Cluster API
  become: "{{ clusterapi_install_become }}"
  ansible.builtin.command:
    argv: >-
      {{
        [playbook_dir ~ '/.local/yake-clusterctl', 'init',
         '--infrastructure', clusterapi_install_infrastructure ~ (':' ~ clusterapi_install_capo_version if clusterapi_install_capo_version | length > 0 else ''),
         '--kubeconfig', '/var/lib/yake/kubeconfig.' ~ clusterapi_install_clusterapi_name]
        + (['--core', 'cluster-api:' ~ clusterapi_install_capi_version,
            '--bootstrap', 'kubeadm:' ~ clusterapi_install_capi_version,
            '--control-plane', 'kubeadm:' ~ clusterapi_install_capi_version] if clusterapi_install_capi_version | length > 0 else [])
      }}
  environment: "{{ {'CLUSTER_TOPOLOGY': clusterapi_install_cluster_topology | lower} | combine(clusterapi_install_proxy_env) }}"
  register: result  # noqa: var-naming[no-role-prefix]
  changed_when: "'Your management cluster has been initialized successfully' in result.stdout"
  when: clusterapi_install_crd.resources | length == 0

# Explicit versions make an upgrade apply the pinned versions, --contract would use the latest.
- name: Upgrade Cluster API providers
  become: "{{ clusterapi_install_become }}"
  ansible.builtin.command:
    argv: >-
      {{
        [playbook_dir ~ '/.local/yake-clusterctl', 'upgrade', 'apply', '--wait-providers',
         '--kubeconfig', '/var/lib/yake/kubeconfig.' ~ clusterapi_install_clusterapi_name]
        + (['--core', 'cluster-api:' ~ clusterapi_install_capi_version,
            '--bootstrap', 'kubeadm:' ~ clusterapi_install_capi_version,
            '--control-plane', 'kubeadm:' ~ clusterapi_install_capi_version,
            '--infrastructure', clusterapi_install_infrastructure ~ ':' ~ clusterapi_install_capo_version]
           if clusterapi_install_capi_version | length > 0 and clusterapi_install_capo_version | length > 0
           else ['--contract', clusterapi_install_contract])
      }}
  environment: "{{ {'CLUSTER_TOPOLOGY': clusterapi_install_cluster_topology | lower} | combine(clusterapi_install_proxy_env) }}"
  register: clusterapi_install_upgrade
  changed_when: "'Scaling down' in clusterapi_install_upgrade.stdout"
  when: clusterapi_install_crd.resources | length > 0

- name: Apply orc controller manifest
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    state: present
    src: /var/lib/yake/install-orc.yaml

- name: Build host aliases for CAPO and ORC controllers
  ansible.builtin.set_fact:
    _clusterapi_install_host_aliases: "{{ _clusterapi_install_host_aliases | d([]) + [{'ip': item.ip, 'hostnames': [item.hostname]}] }}"
  loop: "{{ clusterapi_install_hosts_entries }}"
  when: clusterapi_install_hosts_entries | d([]) | length > 0

- name: Add hosts entries to CAPO and ORC controllers
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    state: patched
    kind: Deployment
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    definition:
      spec:
        template:
          spec:
            hostAliases: "{{ _clusterapi_install_host_aliases }}"
  loop:
    - namespace: capo-system
      name: capo-controller-manager
    - namespace: orc-system
      name: orc-controller-manager
  when: clusterapi_install_hosts_entries | d([]) | length > 0

- name: Wait for all deployments to be available
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    kind: Deployment
    wait: true
    wait_timeout: 300
