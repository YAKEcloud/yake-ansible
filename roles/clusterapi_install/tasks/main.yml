---
- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ clusterapi_install_uid }}"
    group: "{{ clusterapi_install_gid }}"
    mode: "0755"
    state: directory
  loop:
    - /var/lib/yake
    - "{{ playbook_dir }}/.local"

- name: Copy manifest to install ORC
  ansible.builtin.copy:
    src: orc.yaml
    dest: /var/lib/yake/install-orc.yaml
    owner: "{{ clusterapi_install_uid }}"
    group: "{{ clusterapi_install_gid }}"
    mode: "0644"

- name: Initialize Cluster API
  become: "{{ clusterapi_install_become }}"
  ansible.builtin.shell: |
    export CLUSTER_TOPOLOGY={{ clusterapi_install_cluster_topology | lower }}
    {{ playbook_dir }}/.local/yake-clusterctl init --infrastructure {{ clusterapi_install_infrastructure }} --kubeconfig /var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}
  environment: "{{ clusterapi_install_proxy_env }}"
  args:
    executable: /bin/bash
  register: result  # noqa: var-naming[no-role-prefix]
  changed_when: "'Your management cluster has been initialized successfully' in result.stdout"

- name: Apply orc controller manifest
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    state: present
    src: /var/lib/yake/install-orc.yaml

- name: Build host aliases for CAPO and ORC controllers
  ansible.builtin.set_fact:
    _clusterapi_install_host_aliases: "{{ _clusterapi_install_host_aliases | d([]) + [{'ip': item.ip, 'hostnames': [item.hostname]}] }}"
  loop: "{{ clusterapi_install_hosts_entries }}"
  when: clusterapi_install_hosts_entries | d([]) | length > 0

- name: Add hosts entries to CAPO and ORC controllers
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    state: patched
    kind: Deployment
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    definition:
      spec:
        template:
          spec:
            hostAliases: "{{ _clusterapi_install_host_aliases }}"
  loop:
    - namespace: capo-system
      name: capo-controller-manager
    - namespace: orc-system
      name: orc-controller-manager
  when: clusterapi_install_hosts_entries | d([]) | length > 0

- name: Wait for all deployments to be available
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ clusterapi_install_clusterapi_name }}"
    kind: Deployment
    wait: true
    wait_timeout: 300
