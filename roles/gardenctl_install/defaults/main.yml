---
# Opt-in: gardenctl is not installed unless this is set to true
gardenctl_install_enabled: false
gardenctl_install_become: false
gardenctl_install_method: "{{ yake_install_method | d('docker') }}"
gardenctl_install_container_registry: ghcr.io
gardenctl_install_container_image: yakecloud/gardenctl
# renovate: datasource=docker depName=ghcr.io/yakecloud/gardenctl
gardenctl_install_version: 'v2.18.0'
# only used by the binary method, the container image pins its own version
# renovate: datasource=github-releases depName=gardener/gardenlogin
gardenctl_install_gardenlogin_version: 'v0.11.0'
gardenctl_install_garden_name: garden
gardenctl_install_garden_kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
gardenctl_install_home: "{{ '/var/lib/yake/gardenctl' if gardenctl_install_method == 'docker' else ansible_facts.user_dir }}"
gardenctl_install_uid: "{{ ansible_facts.user_uid | string }}"
gardenctl_install_gid: "{{ ansible_facts.user_gid | string }}"
gardenctl_install_proxy_env: "{{ proxy_env | d({}) }}"
