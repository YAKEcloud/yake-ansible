---
- name: Add dex chart repo
  kubernetes.core.helm_repository:  # noqa osism-fqcn
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    repo_name: dex
    repo_url: https://charts.dexidp.io
  environment: "{{ gardener_operator_proxy_env }}"

- name: Template dex values
  ansible.builtin.template:
    src: dex-values.yaml.j2
    dest: /var/lib/yake/gardener-operator/dex-values.yaml
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: 0644

- name: Allow ingress from the garden Istio ingressgateway to Dex
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ingress-to-identity-dex-tcp-5556-from-virtual-garden-istio-ingress
        namespace: garden
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: dex
            app.kubernetes.io/instance: identity
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: virtual-garden-istio-ingress
                podSelector:
                  matchLabels:
                    istio: ingressgateway
                    istio-role: garden
            ports:
              - port: 5556
                protocol: TCP

- name: Allow egress from the garden Istio ingressgateway to Dex
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: egress-to-identity-dex-tcp-5556-from-virtual-garden-istio-ingress
        namespace: virtual-garden-istio-ingress
      spec:
        podSelector:
          matchLabels:
            istio: ingressgateway
            istio-role: garden
        policyTypes:
          - Egress
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: garden
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: dex
                    app.kubernetes.io/instance: identity
            ports:
              - port: 5556
                protocol: TCP

- name: Allow kube-apiserver egress to the garden Istio ingressgateway
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: egress-to-istio-ingressgateway-tcp-9443-from-kube-apiserver
        namespace: garden
      spec:
        podSelector:
          matchLabels:
            role: apiserver
        policyTypes:
          - Egress
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: virtual-garden-istio-ingress
                podSelector:
                  matchLabels:
                    istio: ingressgateway
                    istio-role: garden
            ports:
              - port: 9443
                protocol: TCP

- name: Install reflector
  kubernetes.core.helm:
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    chart_ref: oci://ghcr.io/emberstack/helm-charts/reflector
    chart_version: "{{ gardener_operator_reflector_version }}"
    release_name: reflector
    release_namespace: kube-system
    release_state: present
    wait: true
    values:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
  environment: "{{ gardener_operator_proxy_env }}"

- name: Install dex
  kubernetes.core.helm:
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    update_repo_cache: true
    chart_ref: dex/dex
    chart_version: "{{ gardener_operator_dex_version }}"
    create_namespace: true
    release_name: identity
    release_namespace: garden
    release_state: present
    wait: true
    values_files:
      - /var/lib/yake/gardener-operator/dex-values.yaml
  environment: "{{ gardener_operator_proxy_env }}"

- name: Allow reflector to mirror the garden wildcard TLS secret
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tls
        namespace: garden
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: virtual-garden-istio-ingress

- name: Mirror the wildcard TLS secret for the Dex Istio gateway
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: identity-dex-tls
        namespace: virtual-garden-istio-ingress
        annotations:
          reflector.v1.k8s.emberstack.com/reflects: garden/tls

- name: Expose Dex via the garden Istio ingressgateway
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: networking.istio.io/v1
      kind: Gateway
      metadata:
        name: identity-dex
        namespace: garden
      spec:
        selector:
          istio: ingressgateway
          istio-role: garden
        servers:
          - hosts:
              - "identity.{{ gardener_operator_garden_url }}"
            port:
              name: tls
              number: 443
              protocol: HTTPS
            tls:
              mode: SIMPLE
              credentialName: identity-dex-tls

- name: Route the garden Istio ingressgateway to Dex
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: networking.istio.io/v1
      kind: VirtualService
      metadata:
        name: identity-dex
        namespace: garden
      spec:
        exportTo:
          - virtual-garden-istio-ingress
        gateways:
          - identity-dex
        hosts:
          - "identity.{{ gardener_operator_garden_url }}"
        http:
          - route:
              - destination:
                  host: identity-dex.garden.svc.cluster.local
                  port:
                    number: 5556
