---
- name: Validate required values
  ansible.builtin.assert:
    that:
      - gardener_operator_dex.dashboard_secret | d('') | string | length > 0
      - gardener_operator_dex.theme | d('') in ['', 'light', 'dark']
      - gardener_operator_garden_url | d('') | length > 0
      - gardener_operator_garden_url != 'example.com'
      - gardener_operator_openstack_application_credential_id | d('') | length > 0
      - gardener_operator_openstack_application_credential_secret | d('') | length > 0
      - gardener_operator_shoot_cert_service_issuer_type != 'ca' or
        (gardener_operator_shoot_cert_service_ca_certificate | d('') | length > 0) == (gardener_operator_shoot_cert_service_ca_key | d('') | length > 0)
      - gardener_operator_proxy_host | d('') | length == 0 or gardener_operator_proxy_host is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
    fail_msg: >-
      Missing or invalid values: gardener_operator_dex.dashboard_secret, gardener_operator_dex.theme (light, dark or empty),
      gardener_operator_garden_url (not example.com)
      and the OpenStack application credential id/secret must be set, the cert-service CA certificate and key must be
      set together (or both empty), and gardener_operator_proxy_host must be an IPv4 address (it is used as a /32 in a NetworkPolicy).
    quiet: true

- name: Create gardener-operator directory
  become: true
  ansible.builtin.file:
    path: /var/lib/yake/gardener-operator
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0700"
    state: directory

- name: Create garden namespace
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    name: garden
    api_version: v1
    kind: Namespace
    state: present
    wait: true

- name: Install gardener operator
  kubernetes.core.helm:
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    chart_ref: oci://europe-docker.pkg.dev/gardener-project/releases/charts/gardener/operator
    chart_version: "v{{ gardener_operator_version }}"
    create_namespace: true
    release_name: gardener-operator
    release_namespace: garden
    release_state: present
    wait: true
    values: >-
      {{ _gardener_operator_helm_values
         | combine({'env': gardener_operator_proxy_env | dict2items(key_name='name', value_name='value')}
                   if gardener_operator_proxy_env | d({}) | length > 0 else {}, recursive=True)
         | combine(gardener_operator_helm_values, recursive=True) }}
  environment: "{{ gardener_operator_proxy_env }}"

- name: Extract node CIDR from first InternalIP
  ansible.builtin.shell: |
    set -o pipefail
    {{ playbook_dir }}/.local/yake-kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' | awk -F. '{print $1"."$2"."$3".0/24"}'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
  register: node_cidr_output  # noqa: var-naming[no-role-prefix]
  changed_when: false
  failed_when: node_cidr_output.stdout | trim == ""
  when: gardener_operator_nodes_cidr | length == 0

- name: Set node_cidr fact
  ansible.builtin.set_fact:
    gardener_operator_nodes_cidr: "{{ node_cidr_output.stdout | trim }}"
  when: gardener_operator_nodes_cidr | length == 0

- name: Extract service and pod CIDR from API server flags
  ansible.builtin.shell: |
    set -o pipefail
    dump=$({{ playbook_dir }}/.local/yake-kubectl cluster-info dump) || exit $?
    echo "service=$(printf '%s\n' "$dump" | grep -m 1 -- '--service-cluster-ip-range' | sed -E 's/.*--service-cluster-ip-range=([0-9.\/]+).*/\1/')"
    echo "pod=$(printf '%s\n' "$dump" | grep -m 1 -- '--cluster-cidr' | sed -E 's/.*--cluster-cidr=([0-9.\/]+).*/\1/')"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
  register: cidr_dump_output  # noqa: var-naming[no-role-prefix]
  changed_when: false

- name: Set service_cidr and pod_cidr facts
  ansible.builtin.set_fact:
    gardener_operator_services_cidr: "{{ cidr_dump_output.stdout | regex_search('^service=(.*)$', '\\1', multiline=True) | first | default('') | trim }}"
    gardener_operator_pods_cidr: "{{ cidr_dump_output.stdout | regex_search('^pod=(.*)$', '\\1', multiline=True) | first | default('') | trim }}"

- name: Fail if any CIDR could not be extracted
  ansible.builtin.fail:
    msg: "One or more CIDR values could not be extracted."
  when: gardener_operator_nodes_cidr == '' or
        gardener_operator_services_cidr == '' or
        gardener_operator_pods_cidr == ''

- name: Install Kyverno
  kubernetes.core.helm:
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    chart_ref: kyverno
    chart_repo_url: https://kyverno.github.io/kyverno/
    chart_version: "{{ gardener_operator_kyverno_version }}"
    create_namespace: true
    release_name: kyverno
    release_namespace: kyverno
    release_state: present
    wait: true
    values:
      features:
        forceFailurePolicyIgnore:
          enabled: true
  environment: "{{ gardener_operator_proxy_env }}"
  when: _gardener_operator_kyverno_enabled | bool

- name: Template Kyverno injection policy
  ansible.builtin.template:
    src: kyverno-proxy-policy.yaml.j2
    dest: /var/lib/yake/gardener-operator/kyverno-proxy-policy.yaml
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  when: _gardener_operator_kyverno_enabled | bool

- name: Apply Kyverno injection policy
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    src: /var/lib/yake/gardener-operator/kyverno-proxy-policy.yaml
  when: _gardener_operator_kyverno_enabled | bool

- name: Generate a CA for the cert-service issuer
  ansible.builtin.include_tasks: generated-ca.yml
  when:
    - gardener_operator_shoot_cert_service_issuer_type == 'ca'
    - gardener_operator_shoot_cert_service_ca_certificate | length == 0

- name: Template garden files and dependencies
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/var/lib/yake/gardener-operator/{{ item }}"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  loop:
    - extensions.yaml
    - garden.yaml

- name: Create a garden object and dependencies
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    wait: true
    src: "/var/lib/yake/gardener-operator/{{ item }}"
  register: gardener_operator_garden_apply
  loop:
    - extensions.yaml
    - garden.yaml
  no_log: true

- name: Get Gardener Secret
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    api_version: v1
    kind: Secret
    name: gardener
    namespace: garden
  register: gardener_secret  # noqa: var-naming[no-role-prefix]
  until: gardener_secret.resources | length > 0 and gardener_secret.resources[0].data is defined and gardener_secret.resources[0].data.kubeconfig is defined
  retries: 60
  delay: 10
  no_log: true

- name: Save Kubeconfig to file
  ansible.builtin.copy:
    content: "{{ gardener_secret.resources[0].data.kubeconfig | b64decode }}"
    dest: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  no_log: true
  when: gardener_secret.resources | length > 0

- name: Wait for DNS extension namespace
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    kind: Namespace
    name: "{{ _gardener_operator_dns_provider_namespace_map[gardener_operator_dns_provider_type] }}"
  register: dns_extension_ns  # noqa: var-naming[no-role-prefix]
  until: dns_extension_ns.resources | length > 0
  retries: 30
  delay: 20
  when: gardener_operator_proxy_host | d('') | length > 0

- name: Template proxy NetworkPolicy for DNS extension namespace
  ansible.builtin.template:
    src: proxy-network-policy.yaml.j2
    dest: /var/lib/yake/gardener-operator/proxy-network-policy.yaml
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  when: gardener_operator_proxy_host | d('') | length > 0

- name: Apply proxy NetworkPolicy to DNS extension namespace
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    src: /var/lib/yake/gardener-operator/proxy-network-policy.yaml
  when: gardener_operator_proxy_host | d('') | length > 0

- name: Wait for Garden to be fully reconciled
  ansible.builtin.include_tasks: wait-garden.yml

- name: Wait for extensions to be installed
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    api_version: operator.gardener.cloud/v1alpha1
    kind: Extension
  register: gardener_operator_extensions  # noqa: var-naming[no-role-prefix]
  vars:
    _pending: >-
      {% set ns = namespace(names=[]) %}
      {% for e in gardener_operator_extensions.resources %}
      {% set conds = e.status.conditions | default([]) | items2dict(key_name='type', value_name='status') %}
      {% if e.status.observedGeneration | default(-1) < e.metadata.generation or conds.Installed | default('') != 'True' %}
      {% set ns.names = ns.names + [e.metadata.name] %}
      {% endif %}
      {% endfor %}
      {{ ns.names | join(',') }}
  until:
    - gardener_operator_extensions.resources | length > 0
    - _pending | trim == ''
  retries: 60
  delay: 10

- name: Include dex tasks
  ansible.builtin.include_tasks: dex.yml

- name: Include vgarden tasks
  ansible.builtin.include_tasks: vgarden.yml

# /auth makes the dashboard backend fetch the OIDC discovery from Dex, i.e. the same path as a real login (DNS, network
# and TLS from inside the cluster). It redirects to Dex on success and to /login#error=... otherwise. The probe
# verifies the certificate of the dashboard, unless gardener_operator_login_check_validate_certs is false (staging
# or generated CA, which the Ansible host does not trust).
- name: Check that the dashboard login reaches the identity provider
  ansible.builtin.uri:
    url: "https://dashboard.{{ gardener_operator_garden_url }}/auth"
    follow_redirects: none
    status_code: 302
    validate_certs: "{{ gardener_operator_login_check_validate_certs | bool }}"
    timeout: 30
  register: gardener_operator_login_check_result
  until: gardener_operator_login_check_result.location | d('') is match('https://identity\.' ~ (gardener_operator_garden_url | regex_escape) ~ '/')
  retries: 30
  delay: 10
  failed_when: false
  when: gardener_operator_login_check_enabled | bool

- name: Assert that the dashboard login works
  ansible.builtin.assert:
    that: gardener_operator_login_check_result.location | d('') is match('https://identity\.' ~ (gardener_operator_garden_url | regex_escape) ~ '/')
    fail_msg: >-
      The dashboard login does not reach Dex: {{ gardener_operator_login_check_result.location
      | d(gardener_operator_login_check_result.msg | d('no response')) }}. "Issuer not available" means the dashboard
      pods cannot fetch https://identity.{{ gardener_operator_garden_url }}/.well-known/openid-configuration, e.g.
      because of a DNS search domain of the nodes that returns SERVFAIL. A certificate error means the Ansible host does
      not trust the certificate (ACME staging, generated CA): set gardener_operator_login_check_validate_certs to false.
    quiet: true
  when: gardener_operator_login_check_enabled | bool

- name: Include project tasks
  ansible.builtin.include_tasks: projects.yml

- name: Include managed-seed tasks
  ansible.builtin.include_tasks: managed-seed.yml
