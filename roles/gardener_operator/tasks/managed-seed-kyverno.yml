---
- name: Request admin kubeconfig for managed seed
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/.local/yake-kubectl"
      - create
      - --raw
      - "/apis/core.gardener.cloud/v1beta1/namespaces/garden/shoots/{{ item.name }}/adminkubeconfig"
      - -f
      - "-"
    stdin: '{"apiVersion":"authentication.gardener.cloud/v1alpha1","kind":"AdminKubeconfigRequest","spec":{"expirationSeconds":900}}'
  environment:
    KUBECONFIG: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    # Forwards stdin into the docker exec of the kubectl wrapper
    PARAMETERS: -i
  register: managed_seed_admin_kubeconfig  # noqa: var-naming[no-role-prefix]
  changed_when: false
  no_log: true

- name: Install Kyverno
  kubernetes.core.helm:
    binary_path: "{{ playbook_dir }}/.local/yake-helm"
    kubeconfig: "{{ (managed_seed_admin_kubeconfig.stdout | from_json).status.kubeconfig | b64decode | from_yaml }}"
    chart_ref: kyverno
    chart_repo_url: https://kyverno.github.io/kyverno/
    chart_version: "{{ gardener_operator_kyverno_version }}"
    create_namespace: true
    release_name: kyverno
    release_namespace: kyverno
    release_state: present
    wait: true
    values:
      features:
        forceFailurePolicyIgnore:
          enabled: true
  environment: "{{ gardener_operator_proxy_env }}"
  no_log: true

# A fresh kubeconfig, the Kyverno install can take several minutes
- name: Request admin kubeconfig for managed seed to apply the policy
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/.local/yake-kubectl"
      - create
      - --raw
      - "/apis/core.gardener.cloud/v1beta1/namespaces/garden/shoots/{{ item.name }}/adminkubeconfig"
      - -f
      - "-"
    stdin: '{"apiVersion":"authentication.gardener.cloud/v1alpha1","kind":"AdminKubeconfigRequest","spec":{"expirationSeconds":600}}'
  environment:
    KUBECONFIG: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    PARAMETERS: -i
  register: managed_seed_admin_kubeconfig  # noqa: var-naming[no-role-prefix]
  changed_when: false
  no_log: true

- name: Apply Kyverno injection policy
  kubernetes.core.k8s:
    kubeconfig: "{{ (managed_seed_admin_kubeconfig.stdout | from_json).status.kubeconfig | b64decode | from_yaml }}"
    state: present
    src: /var/lib/yake/gardener-operator/kyverno-proxy-policy.yaml
  no_log: true
