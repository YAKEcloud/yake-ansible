---
- name: Render project.yaml (optional)
  ansible.builtin.template:
    src: project.yaml.j2
    dest: /var/lib/yake/gardener-operator/project.yaml
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Apply project.yaml
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: /var/lib/yake/gardener-operator/project.yaml
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Render CloudProfile
  ansible.builtin.template:
    src: cloudprofile.yaml.j2
    dest: "/var/lib/yake/gardener-operator/cloudprofile-{{ item.name }}.yaml"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  loop: "{{ gardener_operator_cloudprofiles }}"
  when: gardener_operator_cloudprofiles | d([]) | length > 0 or gardener_operator_managed_seeds | d([]) | length > 0

- name: Apply CloudProfile
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: "/var/lib/yake/gardener-operator/cloudprofile-{{ item.name }}.yaml"
  loop: "{{ gardener_operator_cloudprofiles }}"
  no_log: true
  when: gardener_operator_cloudprofiles | d([]) | length > 0 or gardener_operator_managed_seeds | d([]) | length > 0

- name: Render ManagedSeed
  ansible.builtin.template:
    src: managed-seed.yaml.j2
    dest: "/var/lib/yake/gardener-operator/managed-seed-{{ item.name }}.yaml"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  loop: "{{ gardener_operator_managed_seeds }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Apply ManagedSeed
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: "/var/lib/yake/gardener-operator/managed-seed-{{ item.name }}.yaml"
  loop: "{{ gardener_operator_managed_seeds }}"
  no_log: true
  when: gardener_operator_managed_seeds | d([]) | length > 0

# The policy only changes OSCs on their next update. Reconcile managed seeds whose OSCs lack the timesyncd unit
# (NTP newly enabled) or carry it without enable (older policy versions, reported as unhealthy by the node agent).
# OSCs can contain proxy credentials, hence no_log.
- name: Find OperatingSystemConfigs of the managed seeds
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    api_version: extensions.gardener.cloud/v1alpha1
    kind: OperatingSystemConfig
    namespace: "shoot--garden--{{ item.name }}"
  register: gardener_operator_managed_seed_oscs
  no_log: true
  loop: "{{ gardener_operator_managed_seeds }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - gardener_operator_managed_seeds | d([]) | length > 0
    - gardener_operator_ntp_servers | d([]) | length > 0

- name: Reconcile managed seeds with an outdated timesyncd unit
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: patched
    api_version: core.gardener.cloud/v1beta1
    kind: Shoot
    name: "{{ item.item.name }}"
    namespace: garden
    definition:
      metadata:
        annotations:
          gardener.cloud/operation: reconcile
  loop: "{{ gardener_operator_managed_seed_oscs.results | d([]) }}"
  no_log: true
  loop_control:
    label: "{{ item.item.name }}"
  when: >-
    item.resources | d([]) | map(attribute='spec.units', default=[])
    | map('selectattr', 'name', 'equalto', 'systemd-timesyncd.service') | map('selectattr', 'enable', 'defined')
    | map('list') | select('equalto', []) | list | length > 0

- name: Wait for ManagedSeed to be fully ready
  kubernetes.core.k8s_info:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    api_version: core.gardener.cloud/v1beta1
    kind: Shoot
    name: "{{ item.name }}"
    namespace: garden
  register: managed_seed_shoot_status  # noqa: var-naming[no-role-prefix]
  vars:
    _ms_shoot: "{{ managed_seed_shoot_status.resources | first | default({}) }}"
    _ms_status: "{{ _ms_shoot.status | default({}) }}"
    _ms_last_op: "{{ _ms_status.lastOperation | default({}) }}"
    _ms_conditions: "{{ _ms_status.conditions | default([]) | items2dict(key_name='type', value_name='status') }}"
  until:
    - managed_seed_shoot_status.resources | length > 0
    - _ms_status.observedGeneration | default(-1) >= _ms_shoot.metadata.generation | default(999999)
    - _ms_last_op.state | default('') == 'Succeeded'
    - _ms_conditions.APIServerAvailable | default('') == 'True'
    - _ms_conditions.ControlPlaneHealthy | default('') == 'True'
    - _ms_conditions.SystemComponentsHealthy | default('') == 'True'
    - _ms_conditions.EveryNodeReady | default('') == 'True'
    - _ms_conditions.GardenletReady | default('') == 'True'
    - _ms_conditions.ExtensionsReady | default('') == 'True'
    - _ms_conditions.SeedSystemComponentsHealthy | default('') == 'True'
  retries: 90
  delay: 10
  loop: "{{ gardener_operator_managed_seeds }}"
  loop_control:
    label: "{{ item.name }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Wait for the Seed of the ManagedSeed to be ready
  kubernetes.core.k8s_info:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    api_version: core.gardener.cloud/v1beta1
    kind: Seed
    name: "{{ item.name }}"
  register: managed_seed_seed_status  # noqa: var-naming[no-role-prefix]
  vars:
    _ms_seed: "{{ managed_seed_seed_status.resources | first | default({}) }}"
    _ms_seed_status: "{{ _ms_seed.status | default({}) }}"
    _ms_seed_last_op: "{{ _ms_seed_status.lastOperation | default({}) }}"
    _ms_seed_conditions: "{{ _ms_seed_status.conditions | default([]) | items2dict(key_name='type', value_name='status') }}"
  until:
    - managed_seed_seed_status.resources | length > 0
    - _ms_seed_status.observedGeneration | default(-1) >= _ms_seed.metadata.generation | default(999999)
    - _ms_seed_last_op.state | default('') == 'Succeeded'
    - _ms_seed_conditions.GardenletReady | default('') == 'True'
    - _ms_seed_conditions.ExtensionsReady | default('') == 'True'
    - _ms_seed_conditions.SeedSystemComponentsHealthy | default('') == 'True'
  retries: 60
  delay: 10
  loop: "{{ gardener_operator_managed_seeds }}"
  loop_control:
    label: "{{ item.name }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Template Kyverno injection policy for managed seeds
  ansible.builtin.template:
    src: kyverno-proxy-policy.yaml.j2
    dest: /var/lib/yake/gardener-operator/kyverno-proxy-policy.yaml
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0600"
  when:
    - gardener_operator_managed_seeds | d([]) | length > 0
    - _gardener_operator_kyverno_enabled | bool

# The admin kubeconfig is short-lived, so it is requested per seed right before it is used.
- name: Install Kyverno on the managed seeds
  ansible.builtin.include_tasks: managed-seed-kyverno.yml
  loop: "{{ gardener_operator_managed_seeds }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - gardener_operator_managed_seeds | d([]) | length > 0
    - _gardener_operator_kyverno_enabled | bool
