---
- name: Render project.yaml (optional)
  ansible.builtin.template:
    src: project.yaml.j2
    dest: /var/lib/yake/gardener-operator/project.yaml
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0644"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Apply project.yaml
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: /var/lib/yake/gardener-operator/project.yaml
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Render CloudProfile
  ansible.builtin.template:
    src: cloudprofile.yaml.j2
    dest: "/var/lib/yake/gardener-operator/cloudprofile-{{ item.name }}.yaml"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0644"
  loop: "{{ gardener_operator_cloudprofiles }}"
  when: gardener_operator_cloudprofiles | d([]) | length > 0 or gardener_operator_managed_seeds | d([]) | length > 0

- name: Apply CloudProfile
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: "/var/lib/yake/gardener-operator/cloudprofile-{{ item.name }}.yaml"
  loop: "{{ gardener_operator_cloudprofiles }}"
  when: gardener_operator_cloudprofiles | d([]) | length > 0 or gardener_operator_managed_seeds | d([]) | length > 0

- name: Render ManagedSeed
  ansible.builtin.template:
    src: managed-seed.yaml.j2
    dest: "/var/lib/yake/gardener-operator/managed-seed-{{ item.name }}.yaml"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0644"
  loop: "{{ gardener_operator_managed_seeds }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Apply ManagedSeed
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: "/var/lib/yake/gardener-operator/managed-seed-{{ item.name }}.yaml"
  loop: "{{ gardener_operator_managed_seeds }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Wait for ManagedSeed to be fully ready
  kubernetes.core.k8s_info:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    api_version: core.gardener.cloud/v1beta1
    kind: Shoot
    name: "{{ item.name }}"
    namespace: garden
  register: managed_seed_shoot_status  # noqa: var-naming[no-role-prefix]
  vars:
    _ms_shoot: "{{ managed_seed_shoot_status.resources | first | default({}) }}"
    _ms_status: "{{ _ms_shoot.status | default({}) }}"
    _ms_last_op: "{{ _ms_status.lastOperation | default({}) }}"
    _ms_conditions: "{{ _ms_status.conditions | default([]) | items2dict(key_name='type', value_name='status') }}"
  until:
    - managed_seed_shoot_status.resources | length > 0
    - _ms_last_op.state | default('') == 'Succeeded'
    - _ms_conditions.APIServerAvailable | default('') == 'True'
    - _ms_conditions.ControlPlaneHealthy | default('') == 'True'
    - _ms_conditions.SystemComponentsHealthy | default('') == 'True'
    - _ms_conditions.EveryNodeReady | default('') == 'True'
    - _ms_conditions.GardenletReady | default('') == 'True'
    - _ms_conditions.ExtensionsReady | default('') == 'True'
    - _ms_conditions.SeedSystemComponentsHealthy | default('') == 'True'
  retries: 90
  delay: 10
  loop: "{{ gardener_operator_managed_seeds }}"
  loop_control:
    label: "{{ item.name }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Request admin kubeconfig for managed seed
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/.local/yake-kubectl"
      - create
      - --raw
      - "/apis/core.gardener.cloud/v1beta1/namespaces/garden/shoots/{{ item.name }}/adminkubeconfig"
      - -f
      - "-"
    stdin: '{"apiVersion":"authentication.gardener.cloud/v1alpha1","kind":"AdminKubeconfigRequest","spec":{"expirationSeconds":600}}'
  environment:
    KUBECONFIG: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    PARAMETERS: -i
  register: managed_seed_admin_kubeconfig  # noqa: var-naming[no-role-prefix]
  changed_when: false
  no_log: true
  loop: "{{ gardener_operator_managed_seeds }}"
  loop_control:
    label: "{{ item.name }}"
  when: gardener_operator_managed_seeds | d([]) | length > 0

- name: Redirect legacy seed Plutono host to its Istio host
  kubernetes.core.k8s:
    kubeconfig: "{{ (result.stdout | from_json).status.kubeconfig | b64decode | from_yaml }}"
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'seed-plutono-redirect.yaml.j2') | from_yaml_all | list }}"
  vars:
    _plutono_redirect_ingress_domain: "ingress.{{ result.item.name }}.{{ gardener_operator_managed_seeds_project.name }}.{{ gardener_operator_garden_url }}"
    _plutono_redirect_target: "g-seed.{{ _plutono_redirect_ingress_domain }}"
    _plutono_redirect_credential: seed-ingress-wildcard
  loop: "{{ managed_seed_admin_kubeconfig.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item.name }}"
  no_log: true
  when: gardener_operator_managed_seeds | d([]) | length > 0
