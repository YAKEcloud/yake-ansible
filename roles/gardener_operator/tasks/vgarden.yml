---
- name: Template vgarden files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/var/lib/yake/gardener-operator/{{ item }}"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0644"
  loop:
    - rbac.yaml
    - gardenlet.yaml

- name: Create garden project and internal seed
  kubernetes.core.k8s:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    state: present
    wait: true
    src: "/var/lib/yake/gardener-operator/{{ item }}"
  loop:
    - rbac.yaml
    - gardenlet.yaml

- name: Patch gardener annotation for reconcile
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    kind: Garden
    api_version: "operator.gardener.cloud/v1alpha1"
    name: gardener
    definition:
      metadata:
        annotations:
          gardener.cloud/operation: "reconcile"
    merge_type:
      - merge

- name: Template ingress-cert file
  ansible.builtin.template:
    src: seed-ingress-certificate.yaml.j2
    dest: "/var/lib/yake/gardener-operator/seed-ingress-certificate.yaml"
    owner: "{{ gardener_operator_uid }}"
    group: "{{ gardener_operator_gid }}"
    mode: "0644"

- name: Create the certificate and secret
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    wait: true
    src: /var/lib/yake/gardener-operator/seed-ingress-certificate.yaml

- name: Wait for the seed ingress certificate to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    api_version: cert.gardener.cloud/v1alpha1
    kind: Certificate
    name: seed-ingress
    namespace: garden
  register: seed_ingress_certificate  # noqa: var-naming[no-role-prefix]
  vars:
    _cert: "{{ seed_ingress_certificate.resources | first | default({}) }}"
    _cert_status: "{{ _cert.status | default({}) }}"
  until:
    - seed_ingress_certificate.resources | length > 0
    - _cert_status.state | default('') == 'Ready'
  retries: 30
  delay: 10

- name: Wait for internal-seed to be ready
  kubernetes.core.k8s_info:
    kubeconfig: /var/lib/yake/gardener-operator/kubeconfig.vgarden
    api_version: core.gardener.cloud/v1beta1
    kind: Seed
    name: internal-seed
  register: seed_status  # noqa: var-naming[no-role-prefix]
  vars:
    _seed: "{{ seed_status.resources | first | default({}) }}"
    _seed_status: "{{ _seed.status | default({}) }}"
    _seed_last_op: "{{ _seed_status.lastOperation | default({}) }}"
    _seed_conditions: "{{ _seed_status.conditions | default([]) | items2dict(key_name='type', value_name='status') }}"
  until:
    - seed_status.resources | length > 0
    - _seed_last_op.state | default('') == 'Succeeded'
    - _seed_conditions.GardenletReady | default('') == 'True'
    - _seed_conditions.ExtensionsReady | default('') == 'True'
    - _seed_conditions.SeedSystemComponentsHealthy | default('') == 'True'
  retries: 30
  delay: 10

- name: Allow all egress for terminal controller manager
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-all-egress-for-terminal-controller-manager
        namespace: garden
      spec:
        podSelector:
          matchLabels:
            app: terminal-controller-manager
        egress:
          - {}
        policyTypes:
          - Egress

- name: Redirect legacy internal-seed Plutono host to its garden host
  kubernetes.core.k8s:
    kubeconfig: "/var/lib/yake/kubeconfig.{{ gardener_operator_clusterapi_name }}"
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'seed-plutono-redirect.yaml.j2') | from_yaml_all | list }}"
  vars:
    _plutono_redirect_ingress_domain: "ingress.{{ gardener_operator_garden_url }}"
    _plutono_redirect_target: "plutono-garden.{{ gardener_operator_garden_url }}"
    _plutono_redirect_credential: seed-ingress-certificate
