---
- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: _k3s_version  # noqa: var-naming[no-role-prefix]
  changed_when: false
  failed_when: false

- name: Set k3s install required fact
  ansible.builtin.set_fact:
    _management_cluster_k3s_install: "{{ ('k3s version ' ~ management_cluster_k3s_full_version ~ ' ') not in (_k3s_version.stdout | d('')) }}"

# The script is taken from the tag of the requested release and runs as root, so it is
# kept in a private temporary directory. It verifies the k3s binary against the
# sha256sum file of the release itself.
- name: Install or upgrade k3s
  when: _management_cluster_k3s_install | bool
  block:
    - name: Create temporary directory for the k3s install script
      become: true
      ansible.builtin.tempfile:
        state: directory
        prefix: k3s-install.
      register: _management_cluster_k3s_tmp  # noqa: var-naming[no-role-prefix]

    - name: Download k3s install script
      become: true
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ management_cluster_k3s_full_version | urlencode }}/install.sh"
        dest: "{{ _management_cluster_k3s_tmp.path }}/install.sh"
        mode: "0700"
      environment: "{{ management_cluster_proxy_env }}"

    - name: Run k3s install script
      become: true
      ansible.builtin.command: "sh {{ _management_cluster_k3s_tmp.path }}/install.sh"
      environment: "{{ management_cluster_k3s_env | combine(management_cluster_proxy_env) }}"
      changed_when: true
  always:
    - name: Remove install script
      become: true
      ansible.builtin.file:
        path: "{{ _management_cluster_k3s_tmp.path }}"
        state: absent
      when: _management_cluster_k3s_tmp.path is defined

- name: Copy kubeconfig
  become: true
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ management_cluster_kubeconfig }}"
    remote_src: true
    owner: "{{ management_cluster_uid }}"
    group: "{{ management_cluster_gid }}"
    mode: "0600"
  no_log: true
