[project]
site_name = "yake-ansible"
site_description = "Gardener-based Kubernetes platform on OpenStack"
site_url = "https://yakecloud.github.io/yake-ansible/"
repo_url = "https://github.com/YAKEcloud/yake-ansible"
repo_name = "YAKEcloud/yake-ansible"
edit_uri = "edit/main/docs/"
extra_css = ["assets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Networking" = "networking.md" },
  { "Configuration" = "configuration.md" },
  { "Operations" = "operations.md" },
]

[project.theme]
variant = "modern"
logo = "assets/logo.svg"
favicon = "assets/favicon.ico"
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
